[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/oldf-core", "crates/oldf-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sisoyeliot/oldf"

[workspace.dependencies]
oldf-core = { path = "crates/oldf-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
