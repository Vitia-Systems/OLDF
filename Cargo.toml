[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/oldf-core", "crates/oldf-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Vitia-Systems/oldf"

[workspace.dependencies]
oldf-core = { path = "crates/oldf-core" }

[profile.release]
lto = true
codegen-units = 1
strip = true
